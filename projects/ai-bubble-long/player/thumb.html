<!doctype html>
<html><head><meta charset="utf-8"><title>AI Bubble — thumbnail</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="lib.js"></script>
<script>
/* 16:9 YouTube thumbnail (rendered at 1920x1080, saved 1280x720 by cover.py). ?v=1|2 variants. */
(async function(){
const C=document.getElementById('c'),X=C.getContext('2d'),W=1920,H=1080,FD='../../../engine/fonts/';
for(const [f,n,w] of [['Anton','anton-latin-400-normal',400],['Poppins','poppins-latin-800-normal',800],['Poppins','poppins-latin-700-normal',700]]){
  const ff=new FontFace(f,`url(${FD}${n}.woff2)`,{weight:String(w)});await ff.load();document.fonts.add(ff)}
const im=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src='../art/s001.png'});L.init();
const v=new URLSearchParams(location.search).get('v')||'1';
// art plate: CEO on the left, pushed in
X.drawImage(im,60,40,1180,700,-40,0,W*.76,H);
const g=X.createLinearGradient(W*.38,0,W*.72,0);g.addColorStop(0,'rgba(5,7,15,0)');g.addColorStop(1,'rgba(5,7,15,1)');X.fillStyle=g;X.fillRect(0,0,W,H);
X.fillStyle='#05070f';X.fillRect(W*.72,0,W*.28,H);
L.bokeh(X,1.3,'navy');
// balloon, stretched + cracking
L.balloon(X,W*.74,H*.4,300,{lt:0,stretch:1.3,cracks:.7,label:'AI',wob:0});
L.burst(X,W*.74,H*.4,380,.5,{col:'#ffd23f',n:18});
// headline
X.save();X.translate(W*.73,H*.83);X.rotate(-.03);
L.text(X,v==='2'?'KAB PHOOTEGA?':'$7 TRILLION',0,0,{px:150,fam:'Anton',w:400,fill:'#fff',stroke:14,sc:'#000',glow:30,gc:'#ffd23f'});X.restore();
L.hilite(X,'AI BUBBLE',W*.25,H*.12,{px:110,fam:'Anton',w:400,bg:'#ff3b3b',fill:'#fff'});
L.post(X,0,{});
window.DONE=true})();
</script></body></html>
