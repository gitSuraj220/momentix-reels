<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:P;src:url('file:///usr/share/fonts/truetype/google-fonts/Poppins-Bold.ttf');font-weight:700}
@font-face{font-family:P;src:url('file:///usr/share/fonts/truetype/google-fonts/Poppins-Medium.ttf');font-weight:500}
html,body{margin:0;background:#fff;width:1080px;height:1920px;overflow:hidden}
svg text{font-family:P,sans-serif}
</style></head><body>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"></svg>
<script>
const TL=/*TL*/null; const ASSET=/*ASSET*/'';
const W=1080,H=1920,INK='#1b1b1f',GREEN='#1E9E5A',GOLD='#F2B705',GOLDD='#C98A00',RED='#E5383B',BLUE='#2F5DA8',PAPER='#FFFFFF';
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),lerp=(a,b,k)=>a+(b-a)*k;
const ss=(a,b,x)=>{const k=clamp((x-a)/(b-a));return k*k*(3-2*k)};
const back=k=>{k=clamp(k);const c=1.7;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2)};
const bounce=k=>{k=clamp(k);if(k<1/2.75)return 7.5625*k*k;if(k<2/2.75){k-=1.5/2.75;return 7.5625*k*k+.75}if(k<2.5/2.75){k-=2.25/2.75;return 7.5625*k*k+.9375}k-=2.625/2.75;return 7.5625*k*k+.984375};
function R(i){let x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}
const L={};for(const k in TL.lines)L[k]=TL.lines[k][0];
const ct=s=>{const c=TL.chunks.find(c=>c.text.toLowerCase().includes(s.toLowerCase()));return c?c.t:0};
const END=TL.end;
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
// wobble line helper (hand-drawn feel)
function wob(i,t,a=1.2){return a*Math.sin(t*7+i*1.7)}
function T(x,y,s,o={}){return `<text x="${x}" y="${y}" font-size="${o.size||40}" font-weight="${o.w||700}" fill="${o.fill||INK}" text-anchor="${o.anchor||'middle'}" ${o.op!=null?`opacity="${o.op}"`:''} ${o.tr?`transform="${o.tr}"`:''} ${o.ls?`letter-spacing="${o.ls}"`:''}>${s}</text>`}
const S=`stroke="${INK}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"`;
// ---------- characters ----------
// generic stickman: x,y = feet centre; pose {la,ra (arm angles deg from down), ll,rl, lean, mood:'bored'|'smile'|'grin'|'shock', glasses, tie, cap, hold}
function stick(x,y,sc,p={},t=0){
  const g=[];const hy=-300,nk=-240,hip=-110;
  const ang=d=>d*Math.PI/180;
  const arm=(sx,a,len=105)=>`<path d="M${sx},${nk+20} L${sx+Math.sin(ang(a))*len},${nk+20+Math.cos(ang(a))*len}" ${S} fill="none"/>`;
  const leg=(a,len=115)=>`<path d="M0,${hip} L${Math.sin(ang(a))*len},${hip+Math.cos(ang(a))*len}" ${S} fill="none"/>`;
  g.push(`<path d="M0,${nk} L0,${hip}" ${S}/>`);
  g.push(leg(p.ll??-12),leg(p.rl??12));
  if(p.tie)g.push(`<path d="M0,${nk+6} l-10,22 l10,60 l10,-60 z" fill="${RED}" stroke="${INK}" stroke-width="3"/>`);
  g.push(arm(0,p.la??-25),arm(0,p.ra??25));
  // head
  g.push(`<circle cx="0" cy="${hy}" r="58" fill="#fff" ${S}/>`);
  const m=p.mood||'smile';
  if(p.glasses){g.push(`<circle cx="-22" cy="${hy-6}" r="15" fill="none" stroke="${INK}" stroke-width="4"/><circle cx="22" cy="${hy-6}" r="15" fill="none" stroke="${INK}" stroke-width="4"/><path d="M-7,${hy-6} L7,${hy-6}" stroke="${INK}" stroke-width="4"/>`)}
  if(m==='bored'){g.push(`<path d="M-30,${hy-8} L-14,${hy-8} M14,${hy-8} L30,${hy-8}" stroke="${INK}" stroke-width="5" stroke-linecap="round"/><path d="M-14,${hy+26} L14,${hy+26}" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>`)}
  else{const eo=m==='shock'?6:4;g.push(`<circle cx="-22" cy="${hy-6}" r="${eo}" fill="${INK}"/><circle cx="22" cy="${hy-6}" r="${eo}" fill="${INK}"/>`);
    if(m==='grin')g.push(`<path d="M-30,${hy+16} Q0,${hy+52} 30,${hy+16} Z" fill="${INK}"/><path d="M-22,${hy+20} Q0,${hy+30} 22,${hy+20}" fill="#fff"/>`);
    else if(m==='shock')g.push(`<ellipse cx="0" cy="${hy+28}" rx="12" ry="16" fill="${INK}"/>`);
    else g.push(`<path d="M-20,${hy+18} Q0,${hy+34} 20,${hy+18}" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>`)}
  if(p.stache)g.push(`<path d="M-22,${hy+10} Q-10,${hy+2} 0,${hy+10} Q10,${hy+2} 22,${hy+10}" fill="${INK}" stroke="${INK}" stroke-width="3"/>`);
  if(p.cap)g.push(`<path d="M-56,${hy-20} Q0,${hy-90} 56,${hy-20} Z" fill="${p.cap}" stroke="${INK}" stroke-width="5"/><path d="M40,${hy-24} L92,${hy-18}" stroke="${INK}" stroke-width="9" stroke-linecap="round"/>`);
  return `<g transform="translate(${x},${y}) rotate(${p.lean||0}) scale(${sc})">${g.join('')}</g>`}
// Momo (real cutout image); pose: walk|wave|phone; feet at x,y; h = height
function momo(x,y,h,pose,o={}){const ar={walk:297/700,wave:328/700,phone:295/700}[pose];const w=h*ar;
  return `<g transform="translate(${x},${y}) rotate(${o.rot||0}) scale(${o.sx||1},${o.sy||1})"><image href="${ASSET}/momo_${pose}.png" x="${-w/2}" y="${-h}" width="${w}" height="${h}" ${o.flip?'transform="scale(-1,1)"':''}/></g>`}
// coin stack
function stack(x,y,n,col=GOLD,dark=GOLDD,w=110){let s='';for(let i=0;i<n;i++){const yy=y-i*16;s+=`<ellipse cx="${x}" cy="${yy}" rx="${w/2}" ry="16" fill="${dark}" stroke="${INK}" stroke-width="3"/><ellipse cx="${x}" cy="${yy-6}" rx="${w/2}" ry="16" fill="${col}" stroke="${INK}" stroke-width="3"/>`}return s}
function bundle(x,y,sc=1,rot=0,label='₹1,00,000'){return `<g transform="translate(${x},${y}) rotate(${rot}) scale(${sc})"><rect x="-120" y="-50" width="240" height="100" rx="10" fill="#7BC88F" stroke="${INK}" stroke-width="6"/><rect x="-18" y="-50" width="36" height="100" fill="#F4E9C8" stroke="${INK}" stroke-width="4"/><circle cx="-70" cy="0" r="22" fill="none" stroke="#2E7D4F" stroke-width="4"/><circle cx="70" cy="0" r="22" fill="none" stroke="#2E7D4F" stroke-width="4"/>${T(0,95,label,{size:44,fill:GREEN})}</g>`}
function rateBoard(t,label,val,col,flipT,prev){const k=ss(flipT,flipT+.25,t);const sy=Math.abs(Math.cos(k*Math.PI));const showNew=k>.5;
  return `<g transform="translate(540,205)"><rect x="-300" y="-100" width="600" height="200" rx="18" fill="${BLUE}" stroke="${INK}" stroke-width="7"/><g transform="scale(1,${Math.max(.05,sy)})">${showNew?T(0,-15,label,{size:44,fill:'#fff',ls:3})+T(0,62,val,{size:92,fill:col==='red'?'#FF8A8A':'#9BF0B9'}):(prev?T(0,-15,prev[0],{size:44,fill:'#fff',ls:3})+T(0,62,prev[1],{size:92,fill:'#9BF0B9'}):'')}</g></g>`}
// ---------- sets ----------
function wallFloor(){return `<rect width="1080" height="1180" fill="#F3F6FA"/><rect y="1180" width="1080" height="740" fill="#EEE7DA"/>${[0,1,2,3,4,5,6].map(i=>`<path d="M${i*180},1180 L${i*180-120},1920" stroke="#D9CFBD" stroke-width="3"/>`).join('')}<path d="M0,1180 L1080,1180" ${S}/>`}
function fan(t){const a=t*140;return `<g transform="translate(540,70)"><path d="M0,-70 L0,0" ${S}/>${[0,120,240].map(d=>`<ellipse cx="0" cy="0" rx="110" ry="14" fill="#fff" stroke="${INK}" stroke-width="5" transform="rotate(${a+d}) translate(70,0)"/>`).join('')}<circle r="16" fill="${INK}"/></g>`}
function counterSet(t,o={}){let s=wallFloor()+fan(t);
  // gutka sign
  s+=`<g transform="translate(250,470) rotate(-3) scale(.85)"><rect x="-170" y="-90" width="340" height="180" rx="8" fill="#fff" stroke="${RED}" stroke-width="10"/><text x="0" y="-12" font-size="46" font-weight="700" fill="${RED}" text-anchor="middle" font-family="sans-serif">गुटखा थूकना</text><text x="0" y="48" font-size="46" font-weight="700" fill="${RED}" text-anchor="middle" font-family="sans-serif">मना है</text></g>`;
  s+=`<path d="M200,590 q20,-8 34,6 q16,-10 30,4 q-6,20 -30,16 q-20,12 -34,-6z" fill="#B3261E" opacity=".85"/><circle cx="285" cy="618" r="7" fill="#B3261E" opacity=".8"/>`;
  // token display
  const tok=o.token??47;const blink=(Math.floor(t*3)%2)?1:.55;
  s+=`<g transform="translate(905,470)"><rect x="-130" y="-55" width="260" height="110" rx="10" fill="#222" stroke="${INK}" stroke-width="6"/>${T(0,-62,'TOKEN NO.',{size:24,fill:INK})}${T(0,24,typeof tok==='number'?tok.toLocaleString('en-IN'):tok,{size:60,fill:`rgba(255,80,60,${blink})`})}</g>`;
  // glass partition + counter
  s+=`<rect x="420" y="560" width="620" height="440" fill="#DDEEFF" opacity=".55" stroke="${INK}" stroke-width="7"/><path d="M730,560 L730,1000" stroke="${INK}" stroke-width="5"/><ellipse cx="575" cy="900" rx="55" ry="30" fill="#fff" stroke="${INK}" stroke-width="5"/>`;
  // window sign
  const sd=o.serverDown;s+=`<g transform="translate(575,640)"><path d="M-40,-50 L0,-80 L40,-50" stroke="${INK}" stroke-width="3" fill="none"/><rect x="-95" y="-50" width="190" height="70" rx="6" fill="${sd?'#FFE3E3':'#FFF6D6'}" stroke="${INK}" stroke-width="4"/>${T(0,-2,sd?'SERVER DOWN':'LUNCH 1–2',{size:sd?28:34,fill:sd?RED:INK})}</g>`;
  return s}
function counterFront(t,o={}){let s=`<rect x="380" y="1000" width="700" height="260" fill="#B9773E" stroke="${INK}" stroke-width="7"/><rect x="360" y="980" width="740" height="34" rx="6" fill="#D49456" stroke="${INK}" stroke-width="7"/>${[0,1,2].map(i=>`<rect x="${420+i*215}" y="1050" width="180" height="170" rx="8" fill="none" stroke="#7A4A22" stroke-width="5"/>`).join('')}`;
  // pen on thread
  const py=o.penY??0;s+=`<path d="M470,996 C${470+20},${1040} ${500+o.penX*0.5},${1020+py*0.4} ${500+(o.penX||0)},${975+py}" stroke="#555" stroke-width="3" fill="none"/><rect x="${490+(o.penX||0)}" y="${960+py}" width="120" height="20" rx="8" fill="${BLUE}" stroke="${INK}" stroke-width="3" transform="rotate(${o.penR||-8} ${525+(o.penX||0)} ${966+py})"/><rect x="460" y="986" width="24" height="12" fill="#E8E8E8" stroke="${INK}" stroke-width="2"/>`;
  return s}
function babu(x,y,mood,t,o={}){let s=stick(x,y,o.sc||1.05,{la:o.la??-40,ra:o.ra??40,ll:-8,rl:8,mood,glasses:1,tie:1,stache:1,lean:o.lean||0},t);
  if(o.chai){const big=o.mug;const _k=(o.sc||1.05)/1.05;const cx=x+(o.cx??95)*_k,cy=y-(o.cy??190)*_k;s+=big?`<g transform="translate(${cx},${cy})"><rect x="-38" y="-50" width="76" height="90" rx="10" fill="${GOLD}" stroke="${INK}" stroke-width="5"/><path d="M38,-30 q30,0 30,25 q0,25 -30,25" fill="none" stroke="${INK}" stroke-width="6"/>${T(0,10,'₹',{size:44,fill:INK})}${[0,1,2].map(i=>`<path d="M${-16+i*16},-62 q8,-14 0,-28" stroke="#999" stroke-width="3" fill="none" opacity="${.5+.5*Math.sin(t*4+i)}"/>`).join('')}</g>`
    :`<g transform="translate(${cx},${cy})"><path d="M-22,-34 L22,-34 L16,30 L-16,30 Z" fill="#E7C08A" stroke="${INK}" stroke-width="4"/><rect x="-18" y="-20" width="36" height="46" fill="#B36B2C" opacity=".85"/>${[0,1].map(i=>`<path d="M${-6+i*12},-42 q6,-12 0,-24" stroke="#999" stroke-width="3" fill="none" opacity="${.4+.5*Math.sin(t*4+i)}"/>`).join('')}</g>`}
  return s}
function bankFront(cx,cy,sc,t,o={}){return `<g transform="translate(${cx},${cy}) scale(${sc})"><path d="M-330,-260 L0,-420 L330,-260 Z" fill="#fff" ${S}/><rect x="-300" y="-260" width="600" height="60" fill="#fff" ${S}/>${T(0,-217,o.sign||'BANK  ₹',{size:46,ls:6})}${[-240,-120,0,120,240].map(px=>`<rect x="${px-28}" y="-200" width="56" height="300" fill="#fff" ${S}/>`).join('')}<rect x="-340" y="100" width="680" height="40" fill="#fff" ${S}/><rect x="-370" y="140" width="740" height="40" fill="#fff" ${S}/>${o.sd?`<g transform="translate(0,-120)"><rect x="-130" y="-34" width="260" height="60" rx="8" fill="#FFE3E3" stroke="${RED}" stroke-width="5"/>${T(0,10,'SERVER DOWN',{size:30,fill:RED})}</g>`:''}</g>`}
function house(x,y,sc){return `<g transform="translate(${x},${y}) scale(${sc})"><rect x="-130" y="-160" width="260" height="160" fill="#fff" ${S}/><path d="M-160,-160 L0,-290 L160,-160 Z" fill="#FFD9C2" ${S}/><rect x="-30" y="-100" width="60" height="100" fill="#B9773E" ${S}/><rect x="60" y="-120" width="50" height="50" fill="#DDEEFF" ${S}/></g>`}
function card(x,y,sc,rot){return `<g transform="translate(${x},${y}) rotate(${rot}) scale(${sc})"><rect x="-220" y="-140" width="440" height="280" rx="28" fill="#2B2D42" stroke="${INK}" stroke-width="7"/><rect x="-170" y="-60" width="70" height="52" rx="8" fill="${GOLD}" stroke="${INK}" stroke-width="4"/>${T(-40,60,'•••• •••• •••• 4521',{size:30,fill:'#fff',anchor:'middle'})}${T(150,-95,'CREDIT',{size:26,fill:'#bbb'})}</g>`}
function burst(x,y,r,col){let p='';const n=14;for(let i=0;i<n*2;i++){const a=i/(n*2)*Math.PI*2,rr=i%2?r*.62:r;p+=(i?'L':'M')+(x+Math.cos(a)*rr).toFixed(1)+','+(y+Math.sin(a)*rr).toFixed(1)}return `<path d="${p}Z" fill="${col}" stroke="${INK}" stroke-width="7"/>`}
// ---------- caption + small print ----------
function caption(t){let c=null;for(const ch of TL.chunks){if(t>=ch.t-.03&&t<ch.e+.2&&/[A-Za-z0-9₹]/.test(ch.text))c=ch}if(!c)return '';const k=ss(c.t-.03,c.t+.1,t);
  const txt=c.text.replace(/(₹[\d,\.]+( lakh)?|\d+(\.\d+)?%)/g,'<tspan fill="#FFD84D">$1</tspan>');const w=Math.max(260,c.text.length*30+70);
  return `<g opacity="${k}" transform="translate(540,1660) scale(${.92+.08*back((t-c.t)/.18)})"><rect x="${-w/2}" y="-58" width="${w}" height="84" rx="16" fill="rgba(25,25,30,.82)"/><text x="0" y="0" font-size="52" font-weight="700" fill="#fff" text-anchor="middle">${txt}</text></g>`}
function smallPrint(t){if(t<L[3])return '';return T(540,1862,'SBI rates, Nov 2026 · Simple 1-year example · Sirf jaankari ke liye',{size:22,w:500,fill:'#555',op:.85})+T(540,1892,'Banks also keep reserves and pay staff, costs and bad loans',{size:20,w:500,fill:'#777',op:.8})}
// ---------- scenes ----------
function shake(t,t0,amp=14,d=.35){if(t<t0||t>t0+d)return [0,0];const k=1-(t-t0)/d;return [amp*k*Math.sin(t*95),amp*k*Math.cos(t*80)]}
function sceneExterior(t,a,b,o={}){const k=ss(a,b,t);const sc=lerp(1,1.12,k);let s=`<rect width="1080" height="1920" fill="#fff"/>`;
  // faint grid
  for(let i=0;i<14;i++)s+=`<path d="M0,${i*140} L1080,${i*140}" stroke="#F0F0F0" stroke-width="2"/>`;
  s+=`<path d="M0,1250 L1080,1250" ${S}/>`;
  s+=`<g transform="translate(540,960) scale(${sc}) translate(-540,-960)">`+bankFront(540,1030,1.1,t,o);
  // question mark + chips
  if(!o.noQ){const q=back((t-a-.2)/.5);s+=`<g transform="translate(540,${430+8*Math.sin(t*5)}) rotate(${8*Math.sin(t*3)}) scale(${q})">${T(0,60,'?',{size:220,fill:GOLD})}</g>`;
    const c1=back((t-ct('Kabhi socha'))/.35),c2=back((t-ct('HDFC'))/.35);
    s+=`<g transform="translate(250,560) scale(${clamp(c1,0,1.2)})"><rect x="-90" y="-40" width="180" height="80" rx="40" fill="#fff" ${S}/>${T(0,16,'SBI',{size:44,fill:BLUE})}</g>`;
    s+=`<g transform="translate(830,560) scale(${clamp(c2,0,1.2)})"><rect x="-110" y="-40" width="220" height="80" rx="40" fill="#fff" ${S}/>${T(0,16,'HDFC',{size:44,fill:BLUE})}</g>`;
    const tt=back((t-ct('paise kaise'))/.4);s+=`<g transform="translate(540,1420) scale(${clamp(tt,0,1.2)}) rotate(-3)"><rect x="-330" y="-70" width="660" height="120" rx="20" fill="${GOLD}" ${S}/>${T(0,14,'BANK KI KAMAI?',{size:66})}</g>`}
  s+='</g>';return s}
function sceneCounter(t){ // L2..L4 start: deposit + savings
  let s=counterSet(t,{token:47,serverDown:(t>L[2]+1.55&&t<L[2]+1.95)});
  const deposited=ct('₹1 lakh deposit')+.55; // bundle lands
  const landed=t>=deposited;
  // Babu behind glass
  const mood=t<deposited?'bored':(t<L[3]+.4?'grin':'smile');
  s+=babu(880,1000,mood,t,{chai:t<deposited,lean:t<deposited?-4:0,la:t<deposited?-150:-30});
  s+=counterFront(t,penState(t));
  // Momo walks in
  const mk=ss(L[2]-.1,L[2]+1.0,t);const mx=lerp(-180,300,mk);const bob=mk<1?Math.abs(Math.sin(t*12))*-10:0;
  // bundle
  if(t<deposited){const bk=ss(deposited-.45,deposited,t);s+=bundle(lerp(mx+40,700,bk),lerp(1180,955,bk)+bob,lerp(.8,.75,bk),lerp(-8,0,bk))}
  else{const bb=bounce((t-deposited)/.4);s+=bundle(700,955-(1-bb)*30,.75,0)}
  // savings
  if(t>=L[3]){
    // calendar flip
    const cal=ss(L[3]+.4,ct('lagbhag 2.5')+.4,t);const mi=Math.min(11,Math.floor(cal*12));const mon=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][mi];
    s+=`<g transform="translate(300,770)"><rect x="-80" y="-80" width="160" height="160" rx="12" fill="#fff" ${S}/><rect x="-80" y="-80" width="160" height="50" rx="12" fill="${RED}" stroke="${INK}" stroke-width="7"/>${T(0,-42,'1 SAAL',{size:26,fill:'#fff'})}${T(0,45,mon,{size:48})}</g>`;
    // trickle coins to Momo
    const t0=ct('yaani sirf');const n=Math.floor(clamp((t-t0)/1.2)*5);if(t>=t0){s+=stack(330,1300,Math.max(1,n),'#7FE0A0',GREEN,90);s+=T(330,1210-n*16,inr(clamp((t-t0)/1.2)*2500),{size:46,fill:GREEN})}
    // thank you banner
    const bk=ss(t0+.6,t0+1.2,t);if(bk>0)s+=`<g transform="translate(640,1340)"><rect x="${-330*bk}" y="-60" width="${660*bk}" height="120" rx="14" fill="#FFF6D6" ${S}/>${bk>.95?T(0,14,'Thank you for banking with us 🙏',{size:34}):''}</g>`}
  // Momo
  const shrug=t>ct('yaani sirf')+.5?Math.sin((t-ct('yaani sirf'))*6)*5:0;
  s+=momo(mx,1560+bob,560,mk<1?'walk':'wave',{rot:shrug});
  if(t>ct('yaani sirf')+.9){const q=back((t-ct('yaani sirf')-.9)/.3);s+=`<g transform="translate(330,${1000}) scale(${q})">${T(0,0,'itna hi? 🤨',{size:44})}</g>`}
  return s}
function penState(t){// Momo grabs pen, thread yanks back
  const g=ct('Aapne bank')+.75;const k=t-g;if(k<0)return {penX:0,penY:0,penR:-8};
  if(k<.35)return {penX:-lerp(0,140,k/.35),penY:-lerp(0,60,k/.35),penR:-30};
  const r=clamp((k-.35)/.5);const e=1-bounce(r);return {penX:-140*e,penY:-60*e,penR:-8-22*e}}
function sceneLoan(t){const a=L[4];let s=`<rect width="1080" height="1920" fill="#fff"/>`;for(let i=0;i<14;i++)s+=`<path d="M0,${i*140} L1080,${i*140}" stroke="#F0F0F0" stroke-width="2"/>`;
  s+=`<path d="M0,1250 L1080,1250" ${S}/>`;
  s+=bankFront(250,1050,.55,t,{sign:'BANK'});s+=house(800,1250,1.0);
  s+=rateBoard(t,'HOME LOAN','8%','green',ct('lagbhag 8')-.05,['SAVINGS','2.5%']);
  // bundle flies to borrower
  const f=ss(a+.2,a+1.3,t);if(f<1){const x=lerp(260,690,f),y=lerp(880,1050,f)-Math.sin(f*Math.PI)*380;s+=bundle(x,y,.55,f*20)}
  // borrower signing, form unrolling
  const fk=ss(a+1.2,a+3.4,t);s+=stick(640,1480,.9,{la:-20,ra:-120,mood:'smile',cap:'#5DA9E9'},t);

function sceneMath(t){const a=L[5];let s=`<rect width="1080" height="1920" fill="#fff"/>`;for(let i=0;i<14;i++)s+=`<path d="M0,${i*140} L1080,${i*140}" stroke="#F0F0F0" stroke-width="2"/>`;
