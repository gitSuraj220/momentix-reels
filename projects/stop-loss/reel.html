<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:P;src:url('file:///usr/share/fonts/truetype/google-fonts/Poppins-Bold.ttf');font-weight:700}
html,body{margin:0;background:#03050c}
svg text{font-family:P,sans-serif}
</style></head><body>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script>
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ss=(a,b,x)=>{const k=clamp((x-a)/(b-a));return k*k*(3-2*k)};
const lerp=(a,b,k)=>a+(b-a)*k;
const back=k=>{k=clamp(k);const c=1.7;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2)};
function R(i){let x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}
const HORIZON=900;
const gy=x=>1290-0.21*x;           // sand slope line
const STARS=Array.from({length:110},(_,i)=>({x:R(i)*1080,y:R(i+300)*860,r:.7+R(i+5)*1.6,p:R(i+9)*6.28}));
const RAIN=Array.from({length:140},(_,i)=>({x:R(i+700)*1300-100,y:R(i+800)*1920,s:900+R(i+900)*700,l:30+R(i+1000)*40}));
const BUB=Array.from({length:60},(_,i)=>({x:R(i+1200)*1080,y0:R(i+1300)*1920,s:60+R(i+1400)*140,r:3+R(i+1500)*12,p:R(i+1600)*6}));
// ---- story timeline ----
// sign x positions & amounts
const MOVES=[{t0:2.55,t1:3.55,x0:330,x1:540},{t0:5.35,t1:6.35,x0:540,x1:740},{t0:7.85,t1:8.65,x0:740,x1:880}];
const AMT=['-₹20,000','-₹50,000','-₹1,00,000','-₹2,00,000'];
const WAVE0=8.75, SWALLOW=9.55, UNDER=9.6, TXT=11.0, END=14.5;
function signX(t){let x=330;for(const m of MOVES){if(t>=m.t1)x=m.x1;else if(t>m.t0){x=lerp(m.x0,m.x1,ss(m.t0,m.t1,t));break}}return x}
function level(t){let l=0;MOVES.forEach((m,i)=>{if(t>=m.t1-0.15)l=i+1});return l}
function tideX(t){ // tide edge creeping up the slope, in surges
  const keys=[[0,90],[2.4,300],[3.6,330],[5.2,520],[6.4,540],[7.7,720],[8.7,760]];
  let x=keys[0][1];for(let i=1;i<keys.length;i++){if(t<=keys[i][0]){x=lerp(keys[i-1][1],keys[i][1],ss(keys[i-1][0],keys[i][0],t));return x+18*Math.sin(t*2.6)+8*Math.sin(t*5.3)}}
  return keys[keys.length-1][1]+18*Math.sin(t*2.6);
}
function walking(t){for(const m of MOVES)if(t>m.t0&&t<m.t1)return (t-m.t0)/(m.t1-m.t0);return -1}
function mood(t){if(t<2.3)return 'calm';if(t<4.6)return 'worried';if(t<7.2)return 'sweat';return 'panic'}
// stick figure: feet at (fx, gy(fx)); pulling: arms reach back-left to sign
function stick(px,t){
  const W='#f4f4f0', lw=24;
  const gx=gy(px);const wk=walking(t);
  const ph=wk>=0?wk*Math.PI*4:0, amp=wk>=0?1:0;
  const lean=wk>=0?-0.22:(mood(t)==='panic'?0.05*Math.sin(t*20):0); // lean forward (uphill = right) when pulling
  const hipX=px, hipY=gx-150;
  const legL=78;
  const f1x=px+Math.sin(ph)*34*amp-8, f2x=px-Math.sin(ph)*34*amp+8;
  const f1y=gy(f1x)-Math.max(0,Math.cos(ph))*12*amp, f2y=gy(f2x)-Math.max(0,-Math.cos(ph))*12*amp;
  const sx=hipX+Math.sin(-lean)*120, sy=hipY-Math.cos(lean)*120;
  let g='';
  const seg=(x1,y1,x2,y2,w=lw)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${W}" stroke-width="${w}" stroke-linecap="round"/>`;
  const legK=(fx,fy)=>{const mx=(hipX+fx)/2,my=(hipY+fy)/2;return seg(hipX,hipY,mx+6,my,22)+seg(mx+6,my,fx,fy,22)};
  g+=legK(f2x,f2y)+legK(f1x,f1y);
  g+=seg(hipX,hipY,sx,sy,30);
  // arms: if holding sign (worried+ or walking) reach to sign handle at sign post top-right edge
  const sX=signX(t);const holding=(t>2.3&&t<9.4);
  if(holding){const hx=sX+120,hy=gy(sX)-190;g+=seg(sx,sy+14,lerp(sx,hx,.5),lerp(sy+14,hy,.5)+10,20)+seg(lerp(sx,hx,.5),lerp(sy+14,hy,.5)+10,hx,hy,20)+seg(sx,sy+18,hx+8,hy+30,20);}
  else{g+=seg(sx,sy+14,sx-18,sy+110,20)+seg(sx,sy+14,sx+18,sy+110,20);}
  // head
  const hx=sx+Math.sin(-lean)*52, hy=sy-52;
  g+=`<circle cx="${hx}" cy="${hy}" r="40" fill="${W}"/>`;
  const m=mood(t);const E='#151515';
  if(m==='calm'){g+=`<path d="M ${hx-16} ${hy-6} l 10 0 M ${hx+6} ${hy-6} l 10 0" stroke="${E}" stroke-width="4" stroke-linecap="round"/><path d="M ${hx-10} ${hy+12} q 10 8 20 0" stroke="${E}" stroke-width="4" fill="none" stroke-linecap="round"/>`}
  else if(m==='worried'){g+=`<circle cx="${hx-10}" cy="${hy-4}" r="4.5" fill="${E}"/><circle cx="${hx+12}" cy="${hy-4}" r="4.5" fill="${E}"/><path d="M ${hx-18} ${hy-18} l 12 4 M ${hx+20} ${hy-18} l -12 4" stroke="${E}" stroke-width="3.5" stroke-linecap="round"/><path d="M ${hx-8} ${hy+16} q 9 -6 18 0" stroke="${E}" stroke-width="4" fill="none" stroke-linecap="round"/>`}
  else if(m==='sweat'){g+=`<circle cx="${hx-10}" cy="${hy-2}" r="5" fill="${E}"/><circle cx="${hx+12}" cy="${hy-2}" r="5" fill="${E}"/><path d="M ${hx-20} ${hy-18} l 12 5 M ${hx+22} ${hy-18} l -12 5" stroke="${E}" stroke-width="3.5" stroke-linecap="round"/><path d="M ${hx-9} ${hy+18} l 18 -2" stroke="${E}" stroke-width="4" stroke-linecap="round"/>`;
    const dy=((t*60)%40);g+=`<path d="M ${hx+34} ${hy-14+dy*0.4} q 7 12 0 16 q -7 -4 0 -16" fill="#7cc3ff" opacity="${1-dy/40}"/>`}
  else{const sh=Math.sin(t*40)*1.5;g+=`<circle cx="${hx-11+sh}" cy="${hy-4}" r="8" fill="#fff" stroke="${E}" stroke-width="3"/><circle cx="${hx+13+sh}" cy="${hy-4}" r="8" fill="#fff" stroke="${E}" stroke-width="3"/><circle cx="${hx-11+sh}" cy="${hy-4}" r="3.5" fill="${E}"/><circle cx="${hx+13+sh}" cy="${hy-4}" r="3.5" fill="${E}"/><ellipse cx="${hx+1}" cy="${hy+20}" rx="8" ry="10" fill="${E}"/>`;
    for(let k=0;k<2;k++){const dy=((t*80+k*20)%40);g+=`<path d="M ${hx+(k?36:-38)} ${hy-16+dy*0.5} q 7 12 0 16 q -7 -4 0 -16" fill="#7cc3ff" opacity="${1-dy/40}"/>`}}
  return g;
}
function sign(t){
  const x=signX(t), gx=gy(x);
  const lv=level(t);
  let shake=0;for(const m of MOVES){shake+=Math.sin(t*38)*5*Math.exp(-Math.pow((t-m.t1)/0.12,2))}
  const tilt=walking(t)>=0?-6:shake*0.6;
  let g=`<g transform="rotate(${tilt} ${x} ${gx})">`;
  g+=`<rect x="${x-7}" y="${gx-200}" width="14" height="205" rx="3" fill="#7a5a36"/>`;
  g+=`<rect x="${x-140}" y="${gx-330}" width="280" height="150" rx="10" fill="#f3ede0" stroke="#6b4a2a" stroke-width="7"/>`;
  g+=`<text x="${x}" y="${gx-268}" font-size="44" font-weight="700" fill="#1c1c1c" text-anchor="middle" letter-spacing="2">STOP LOSS</text>`;
  // amount flip
  let k=1;for(const m of MOVES){if(t>m.t1-0.15&&t<m.t1+0.25)k=ss(m.t1-0.15,m.t1+0.2,t)}
  g+=`<g transform="translate(${x} ${gx-205}) scale(1 ${0.3+0.7*back(k)})"><text x="0" y="0" font-size="${lv>=3?38:(lv>=2?44:50)}" font-weight="700" fill="#e5352b" text-anchor="middle">${AMT[lv]}</text></g>`;
  g+='</g>';return g;
}
function water(t){
  const tx=tideX(t);let g='';
  // shallow water polygon over sand: from x=0 to tide edge, following slope slightly above it
  const pts=[];const N=40;
  for(let i=0;i<=N;i++){const x=tx*i/N;const lift=10+ (1-i/N)*30;pts.push([x,gy(x)-lift-6*Math.sin(t*3+i*0.7)*(i/N)])}
  let d=`M 0 ${HORIZON} L 0 ${pts[0][1]} `+pts.map(p=>`L ${p[0]} ${p[1]}`).join(' ')+` L ${tx+6} ${gy(tx+6)} L ${tx} ${gy(tx)+4} L 0 ${gy(0)} Z`;
  g+=`<path d="M 0 ${gy(0)} `+pts.map(p=>`L ${p[0]} ${p[1]}`).join(' ')+` L ${tx+8} ${gy(tx+8)} Z" fill="#2768ad" opacity=".92"/>`;
  g+=`<path d="M `+pts.map(p=>`${p[0]} ${p[1]}`).join(' L ')+`" stroke="#8fc2f0" stroke-width="5" fill="none" opacity=".9"/>`;
  // foam bubbles at edge
  for(let k=0;k<14;k++){const fx=tx-60+k*6+4*Math.sin(t*4+k);const fy=gy(fx)-12-3*Math.sin(t*6+k*1.3);g+=`<circle cx="${fx}" cy="${fy}" r="${3+(k%4)}" fill="#e8f4ff" opacity="${0.5+0.4*Math.sin(t*5+k)}"/>`}
  return g;
}
function bigWave(t){
  const k=ss(WAVE0,SWALLOW,t); if(k<=0)return '';
  // big curling wave sweeping from left to right
  const cx=lerp(-350,1350,Math.pow(k,1.1)), top=lerp(1100,260,Math.pow(k,0.6));
  const d=`M -400 2200 L -400 ${top+380} C ${cx-650} ${top+120}, ${cx-260} ${top-40}, ${cx} ${top} C ${cx+150} ${top+20}, ${cx+190} ${top+150}, ${cx+70} ${top+200} C ${cx-20} ${top+215}, ${cx-50} ${top+300}, ${cx+30} ${top+430} C ${cx+90} ${top+560}, ${cx+140} ${top+800}, ${cx+160} 2200 Z`;
  let g=`<path d="${d}" fill="#1f5fa3"/>`;
  // inner shading of the barrel
  g+=`<path d="M ${cx+70} ${top+200} C ${cx-20} ${top+215}, ${cx-50} ${top+300}, ${cx+30} ${top+430} C ${cx-120} ${top+380}, ${cx-140} ${top+250}, ${cx+70} ${top+200} Z" fill="#164a85"/>`;
  // crest foam line
  g+=`<path d="M ${cx-520} ${top+170} C ${cx-300} ${top+10}, ${cx-80} ${top-25}, ${cx+60} ${top+40} C ${cx+130} ${top+80}, ${cx+140} ${top+150}, ${cx+80} ${top+190}" stroke="#eef7ff" stroke-width="14" fill="none" stroke-linecap="round"/>`;
  g+=`<path d="M ${cx-800} ${top+520} C ${cx-560} ${top+380}, ${cx-330} ${top+360}, ${cx-120} ${top+460}" stroke="#5d9be0" stroke-width="9" fill="none" opacity=".75" stroke-linecap="round"/>`;
  g+=`<path d="M ${cx-900} ${top+760} C ${cx-650} ${top+640}, ${cx-420} ${top+640}, ${cx-220} ${top+720}" stroke="#4a88cf" stroke-width="7" fill="none" opacity=".6" stroke-linecap="round"/>`;
  // spray
  for(let i=0;i<34;i++){const a=R(i+2000),b=R(i+2100);const x=cx-160+a*240+12*Math.sin(t*9+i);const y=top+10-b*55+10*Math.cos(t*8+i)+(cx-x)*0.12;g+=`<circle cx="${x}" cy="${y}" r="${3+b*9}" fill="#f2f8ff" opacity="${0.5+0.4*a}"/>`}
  return g;
}
window.renderAt=function(t){
  let g=`<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#02030a"/><stop offset="1" stop-color="#07102a"/></linearGradient>
  <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a88c5e"/><stop offset="1" stop-color="#5d4a30"/></linearGradient>
  <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2669ad"/><stop offset=".6" stop-color="#173f73"/><stop offset="1" stop-color="#081a35"/></linearGradient>
  <filter id="gl"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;
  const fin=ss(0,.5,t);
  // camera: slow push-in following the man; shake at crash
  const px=signX(t)+150;
  const cz=lerp(1.0,1.32,ss(0.5,8.6,t)), cxT=lerp(540,Math.min(px,820),ss(0.5,8.6,t)), cyT=lerp(1000,gy(px)-260,ss(0.5,8.6,t));
  const shake=(t>SWALLOW-0.3&&t<UNDER+0.6)?(1-ss(SWALLOW,UNDER+0.6,t))*14:0;
  const sxk=Math.sin(t*55)*shake, syk=Math.cos(t*47)*shake;
  g+=`<rect width="1080" height="1920" fill="url(#sky)"/>`;
  g+=`<g opacity="${fin}" transform="translate(${540+sxk} ${1000+syk}) scale(${cz}) translate(${-cxT} ${-cyT})">`;
  g+=STARS.map(s=>`<circle cx="${s.x}" cy="${s.y}" r="${s.r}" fill="#fff" opacity="${(0.35+0.55*(.5+.5*Math.sin(t*1.7+s.p)))*(1-0.5*ss(7.4,8.2,t))}"/>`).join('');
  // moon (appears with storm clouds)
  g+=`<circle cx="900" cy="230" r="46" fill="#d8d6c4" opacity="${0.85*ss(8.0,9.0,t)}"/>`;
  // sea
  g+=`<rect x="-200" y="${HORIZON}" width="1500" height="900" fill="#081833"/>`;
  for(let k=0;k<6;k++){const y=HORIZON+30+k*45;g+=`<path d="M ${-200+((t*30+k*90)%160)} ${y} q 40 -6 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0" stroke="#12305c" stroke-width="3" fill="none" opacity=".6"/>`}
  // sand
  g+=`<path d="M -200 ${gy(-200)} L 1300 ${gy(1300)} L 1300 2100 L -200 2100 Z" fill="url(#sand)"/>`;
  g+=`<line x1="-200" y1="${gy(-200)}" x2="1300" y2="${gy(1300)}" stroke="#c9ad7c" stroke-width="4"/>`;
  g+=water(t);
  g+=sign(t);
  if(t<SWALLOW+0.05)g+=stick(signX(t)+150,t);
  g+=bigWave(t);
  // rain
  const rk=ss(7.2,7.9,t)*(1-ss(SWALLOW,SWALLOW+0.1,t));
  if(rk>0)g+=RAIN.map(r=>{const y=((r.y+t*r.s)%2200)-200;const x=r.x-(y*0.18);return `<line x1="${x}" y1="${y}" x2="${x-r.l*0.18}" y2="${y+r.l}" stroke="#9fb6d6" stroke-width="2.5" opacity="${0.55*rk}"/>`}).join('');
  g+=`</g>`;
  // UNDERWATER
  const uw=ss(SWALLOW-0.05,UNDER+0.15,t);
  if(uw>0){
    const dk=ss(10.6,11.4,t);
    g+=`<g opacity="${uw}"><rect width="1080" height="1920" fill="url(#deep)"/><rect width="1080" height="1920" fill="#030a18" opacity="${0.75*dk}"/>`;
    // light rays
    for(let k=0;k<5;k++){const x=150+k*200+30*Math.sin(t*0.8+k);g+=`<path d="M ${x} -50 L ${x+90} -50 L ${x+260} 1300 L ${x+120} 1300 Z" fill="#9fd0ff" opacity="${0.06*(1-dk*0.7)}"/>`}
    g+=BUB.map(b=>{const y=((b.y0-(t-UNDER)*b.s)%1920+1920)%1920;return `<circle cx="${b.x+12*Math.sin(t*2+b.p)}" cy="${y}" r="${b.r}" fill="none" stroke="#cfe8ff" stroke-width="2.5" opacity="${0.55*(1-dk*0.5)}"/>`}).join('');
    // floating sign debris
    const ft=t-UNDER;g+=`<g transform="translate(${720+ft*18} ${1250-ft*35}) rotate(${-25+ft*9})" opacity="${0.9*(1-dk*0.6)}"><rect x="-120" y="-60" width="240" height="120" rx="8" fill="#e9e2d2" stroke="#6b4a2a" stroke-width="6"/><text x="0" y="-8" font-size="34" font-weight="700" fill="#222" text-anchor="middle">STOP LOSS</text></g>`;
    // giant loss number
    const nk=ss(UNDER,UNDER+0.5,t)*(1-ss(10.7,11.1,t));
    g+=`<g opacity="${nk}" transform="translate(540 ${880+Math.sin(t*1.6)*14}) scale(${0.85+0.15*back(ss(UNDER,UNDER+0.45,t))})"><text x="0" y="0" font-size="150" font-weight="700" fill="#ff3b30" text-anchor="middle" filter="url(#gl)" letter-spacing="4">-₹5,00,000</text></g>`;
    // typed end text
    const L=[["MOVING YOUR STOP LOSS","#ffffff"],["ISN'T HOPE.","#ffffff"],["IT'S ",'#ffffff',"DENIAL.","#ff3b30"]];
    const full=["MOVING YOUR STOP LOSS","ISN'T HOPE.","IT'S DENIAL."];
    const cps=22;let chars=Math.floor(Math.max(0,t-TXT)*cps);
    let y=820;
    full.forEach((line,i)=>{const n=Math.max(0,Math.min(line.length,chars));chars-=line.length+3;if(n<=0&&i>0&&chars<-line.length)return;
      let s=line.slice(0,n);let html='';
      if(i===2&&n>5){html=`<tspan fill="#fff">IT'S </tspan><tspan fill="#ff3b30">${s.slice(5)}</tspan>`}else html=`<tspan fill="#fff">${s}</tspan>`;
      const cur=(n<line.length&&n>0)||(i===2&&n===line.length&&Math.floor(t*2.5)%2===0);
      g+=`<text x="540" y="${y}" font-size="66" font-weight="700" text-anchor="middle" letter-spacing="5">${html}${cur?'<tspan fill="#fff">▌</tspan>':''}</text>`;y+=96;});
    const hk=ss(13.0,13.5,t);
    g+=`<text x="540" y="${y+60}" font-size="38" font-weight="700" fill="#ffd257" text-anchor="middle" opacity="${hk}" letter-spacing="1">Stop loss khiskana umeed nahi…</text>`;
    g+=`<text x="540" y="${y+112}" font-size="38" font-weight="700" fill="#ffd257" text-anchor="middle" opacity="${hk}" letter-spacing="1">inkaar hai.</text>`;
    g+=`</g>`;
  }
  // flash on crash
  g+=`<rect width="1080" height="1920" fill="#ffffff" opacity="${0.6*Math.exp(-Math.pow((t-SWALLOW)/0.08,2))}"/>`;
  document.getElementById('s').innerHTML=g;return true;
};
window.renderAt(0);
</script></body></html>
