function drawDots(id, t, seed) {
  const cv = g(id), c = cv.getContext('2d');
  c.clearRect(0, 0, W, H);
  for (let i = 0; i < 160; i++) {
    const k = seed * 1000 + i;
    const x = ((R(k) * W + t * (R(k + 1) - .5) * 50 + Math.sin(t * .8 + i) * 8) % W + W) % W;
    const y = ((R(k + 2) * H - t * (12 + R(k + 3) * 34)) % H + H) % H;
    const r = 1 + R(k + 4) * 2.6;
    const a = (.07 + R(k + 5) * .3) * (.65 + .35 * Math.sin(t * 2.2 + i * 1.7));
    c.fillStyle = `rgba(255,255,255,${a.toFixed(3)})`;
    c.beginPath(); c.arc(x, y, r, 0, 6.2832); c.fill();
  }
}

  const tCombo = C('ka combo,'), tNo = C('bina code.');
  // chips approach
  const inp = eOut(P(lt, .02, .45));
  const drift = P(t, L(5) + .45, tCombo - .22 - L(5) - .45);
  const rush = eIn(P(t, tCombo - .22, .22));
  const nX = lerp(lerp(-700, 280, inp), 330, drift), lX = lerp(lerp(1700, 790, inp), 740, drift);
  const gone = t >= tCombo;
  S('n8nC', lerp(nX, 540, rush) - 540, Math.sin(t * 3) * 5, 1 - .3 * rush, rush * 8, gone ? 0 : 1);
  S('lovC', lerp(lX, 540, rush) - 540, Math.sin(t * 3 + 1) * 5, 1 - .3 * rush, -rush * 8, gone ? 0 : 1);
  S('plus', 0, 0, 1 + .1 * Math.sin(t * 6), (t - L(5)) * 90, P(lt, .4, .2) * (1 - rush));
  const fp = P(t, tCombo, .5);
  S('flash', 0, 0, .3 + 2 * eOut(fp), 0, fp > 0 && fp < 1 ? 1 - eIn(fp) : 0);
  const op = pop(t, tCombo, .5);
  S('opalL', 0, Math.sin(t * 2) * 5, op.s, 0, gone ? op.o : 0);
  const np = pop(t, tNo, .35);
  S('noCode', 0, Math.sin(t * 3) * 4, np.s, -6, np.o);
  // nodes
  for (let i = 0; i < 4; i++) {
    const p = pop(lt, .25 + i * .18, .4);
    S('nd' + i, 0, Math.sin(t * 2 + i) * 4, lerp(.7, 1, p.s), 0, p.o);
    const okp = pop(t, L(5) + 1.1 + i * .55, .3); S('ok' + i, 0, 0, okp.s, 0, okp.o);
  }
  for (let i = 0; i < 3; i++) {
    const path = g('wp' + i), len = path.getTotalLength();
    const vis = P(lt, .45 + i * .18, .3);
    path.style.opacity = vis;
    path.setAttribute('stroke-dashoffset', (-t * 70).toFixed(1));
    for (let k = 0; k < 2; k++) {
      const f = ((t * .9 + k * .5 + i * .23) % 1 + 1) % 1, pt = path.getPointAtLength(f * len);
      const c = g(`pk${i}_${k}`);
      c.setAttribute('cx', pt.x.toFixed(1)); c.setAttribute('cy', pt.y.toFixed(1));
      c.style.opacity = vis * Math.sin(f * Math.PI);
    }
  }
}

// ---------- Beat 6 ----------
function r6(lt, t) {
  drawDots('d6', t, 6);
  const span = 6 * (220 + 36) * 2; // one full set of 12 tiles
  const v0 = 2100, dec = 520;
  const off = v0 * lt - dec * lt * lt;
  const speed = Math.max(0, v0 - 2 * dec * lt);
  g('mbg').setAttribute('stdDeviation', `${(speed / 120).toFixed(1)} 0`);
  const oA = -((off % span) + span) % span, oB = -span + (((off * .85) % span) + span) % span;
  S('rowA', oA, 0, 1, 0, P(lt, .02, .2));
  S('rowB', oB, 0, 1, 0, P(lt, .02, .2));
  const tp = P(lt, .1, .3); S('s6T', 0, 60 * (1 - eOut(tp)), 1, 0, tp);
  const cp = pop(lt, .15, .4);
  S('cnt', 0, 0, cp.s, 0, cp.o);
  const ph = ((lt % .5) / .5);
  S('c4', 0, 0, 1 + .14 * Math.pow(1 - ph, 3), 0, 1);
  const tStop = C('4 hain.');
  const f = 8 * P(t, L(6), tStop - L(6)), n = 4 + Math.floor(f + 1e-6);
  const c12 = g('c12'); if (c12.textContent !== String(n)) c12.textContent = String(n);
  const tick = n < 12 ? (f % 1) : P(t, tStop, .3);
  S('c12', 0, -10 * Math.pow(1 - tick, 4) * (n < 12 ? 1 : 0), 1 + .08 * Math.pow(1 - tick, 3), 0, 1);
  const sp = P(lt, .35, .3); S('s6sub', 0, 20 * (1 - eOut(sp)), 1, 0, sp);
}

// ---------- Beat 7 ----------
function r7(lt, t) {
  for (let i = 0; i < 7; i++) { const p = P(lt, .06 + i * .04, .3); S('ct' + i, 0, 70 * (1 - eBack(p)) + Math.sin(t * 3 + i * .6) * 4 * p, 1, 0, p); }
  const bp = pop(lt, .3, .45);
  const ph = (((lt - .3) % .6) + .6) % .6 / .6;
  const pulse = lt > .75 ? .06 * Math.pow(1 - ph, 3) : 0;
  S('bub', 0, Math.sin(t * 2) * 6, bp.s * (1 + pulse), Math.sin(t * 1.5) * 1.5, bp.o);
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2 + t * .7;
    const sp = pop(lt, .5 + i * .07, .4);
    const tw = .75 + .35 * Math.sin(t * 5 + i * 2);
    S('sp' + i, Math.cos(a) * 400, Math.sin(a) * 250 + Math.sin(t * 2) * 6, sp.s * tw, t * 60 + i * 30, sp.o * .95);
  }
  const lp = P(lt, .55, .35); S('cmL', 0, 30 * (1 - eOut(lp)), 1, 0, lp);
  const ap = P(lt, .8, .3), bo = Math.abs(Math.sin(t * 5)) * 26;
  S('arrow', bo * .8, bo, 1, 0, ap);
  const cbp = pop(lt, .9, .4);
  S('cbtn', 0, 0, cbp.s * (1 + .05 * Math.sin(t * 2 * Math.PI / .6)), 0, cbp.o);
  const rq = ((lt - .9) % 1.2 + 1.2) % 1.2 / 1.2;
  S('cring', 0, 0, 1 + .8 * eOut(rq), 0, lt > .9 ? .8 * (1 - rq) : 0);
  const mp = pop(lt, .05, .45);
  S('m7', 0, Math.sin(t * 2.2) * 7, mp.s, Math.sin(t * 2.6) * 4, mp.o);
}

// ======================= CAPTIONS =======================
const HL = /^(Antigravity|Stitch|Opal|n8n|Lovable|Google)/;
let capKey = null;
function capHTML(ch) {
  const toks = ch[2].split(' '), isCTA = ch[0] >= L(7);
  return toks.map((w, i) => {
    let h = HL.test(w) || (w === 'AI' && toks[i + 1] === 'Studio') || (w === 'Studio' && toks[i - 1] === 'AI') || (isCTA && /"AI"/.test(w));
    return `<span class="w${h ? ' hl' : ''}" id="cw_${i}">${esc(w)}</span>`;
  }).join(' ');
}
function rCap(t) {
  let ch = TL.chunks.find(c => t >= c[0] && t < c[1]);
  const lastC = TL.chunks[TL.chunks.length - 1];
  if (!ch && t >= lastC[1]) ch = lastC;
  const el = g('capin');
  if (!ch) { el.style.opacity = 0; return; }
  const key = ch[0] + ch[2];
  if (key !== capKey) { el.innerHTML = capHTML(ch); capKey = key; }
  const p = P(t, ch[0], .12);
  el.style.transform = `scale(${(.9 + .1 * eBack(p)).toFixed(4)})`;
  el.style.opacity = clamp(p * 2.5);
  const n = ch[2].split(' ').length, dur = (ch[1] - ch[0]) * .85;
  for (let i = 0; i < n; i++) {
    const wt = ch[0] + dur * i / n;
    const w = el.children[i];
    if (w) w.style.opacity = t >= wt ? 1 : .45;
  }
}

// ======================= FRAME =======================
function frame(t) {
  t = clamp(t, 0, TL.end);
  let dark = false;
  SC.forEach((s, i) => {
    const el = g(s.id), last = i === SC.length - 1;
    const vs = i === 0 ? -1 : s.a - TR / 2, ve = last ? 1e9 : s.b + TR / 2;
    if (t >= s.a && t < (last ? 1e9 : s.b)) dark = s.dark;
    if (t < vs || t >= ve) { el.style.display = 'none'; return; }
    el.style.display = 'block';
    let x = 0, blur = 0, z = 1;
    if (i > 0 && t < s.a + TR / 2) { const p = clamp((t - (s.a - TR / 2)) / TR); x = W * (1 - eIO(p)); blur = 24 * (1 - p); z = 2; }
    else if (!last && t >= s.b - TR / 2) { const p = clamp((t - (s.b - TR / 2)) / TR); x = -W * eIO(p); blur = 24 * p; }
    el.style.transform = `translateX(${x.toFixed(1)}px)`;
    el.style.filter = blur > .05 ? `blur(${blur.toFixed(2)}px)` : 'none';
    el.style.zIndex = z;
    const lt = t - s.a, dur = s.b - s.a;
    g(s.id + 'cam').style.transform = `scale(${(1 + .05 * clamp(lt / dur)).toFixed(4)})`;
    s.fn(lt, t, dur);
  });
  rCap(t);
  const fine = g('fine');
  fine.style.opacity = t >= L(2) ? .5 * P(t, L(2), .3) : 0;
  fine.style.color = dark ? '#fff' : '#111';
}

// ======================= READY / RENDER =======================
let readyP = null;
function ready() {
  if (!readyP) readyP = (async () => {
    try {
      await Promise.all(['600 italic 120px Lora', '500 20px Poppins', '600 20px Poppins', '700 20px Poppins', '800 20px Poppins'].map(f => document.fonts.load(f, 'Aa₹÷')));
    } catch (e) {}
    try { await document.fonts.ready; } catch (e) {}
    await Promise.all([...document.images].map(async im => {
      try { await im.decode(); } catch (e) { im.style.display = 'none'; }
      if (!im.naturalWidth) im.style.display = 'none';
    }));
  })();
  return readyP;
}
window.renderAt = async (t) => {
  await ready();
  frame(+t || 0);
  await Promise.all([...document.images].filter(im => im.style.display !== 'none').map(im => im.decode().catch(() => {})));
};

// ======================= PREVIEW MODE =======================
if (/[?&]play\b/.test(location.search)) {
  const btn = g('play'); btn.style.display = 'flex';
  const audio = new Audio('vo.mp3');
  let t0 = 0, useAudio = true, busy = false;
  const now = () => performance.now() / 1000;
  const tick = async () => {
    let t = (useAudio && !audio.paused && audio.readyState >= 2) ? audio.currentTime : now() - t0;
    if (t >= TL.end) { t = 0; t0 = now(); try { audio.currentTime = 0; audio.play(); } catch (e) {} }
    if (!busy) { busy = true; await window.renderAt(t); busy = false; }
    setTimeout(tick, 1000 / 60);
  };
  btn.addEventListener('click', async () => {
    btn.style.display = 'none';
    await ready();
    t0 = now();
    try { await audio.play(); } catch (e) { useAudio = false; }
    tick();
  });
  window.renderAt(0);
} else {
  window.renderAt(0);
}
</script>
