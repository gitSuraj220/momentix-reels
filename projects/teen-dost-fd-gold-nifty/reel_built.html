function finalScore(t){const k=ss(B[9],B[9]+.4,t);if(k<=0)return '';let s='';
  const items=[['Bunty','FD',3.978,GREY,'#5f636b',.17],['Ravi','Nifty fund',6.320,BLUE,BLUE,.5],['Momo','Sona',14.940,ORG,'#b06b10',.83]];
  items.forEach(([n,w,v,col,tc,fx],i)=>{const t0=B[9]+.5+[3.1,1.8,0.6][i];const kk=ss(t0,t0+.3,t);if(kk<=0)return;const cv=lerp(1,v,ss(t0,t0+.9,t));const x=80+fx*920;
    s+=`<g opacity="${kk}" transform="translate(${x},1185) scale(${.7+.3*back((t-t0)/.35)})"><rect x="-150" y="-62" width="300" height="104" rx="16" fill="${PAPER}" stroke="${col}" stroke-width="5"/>${txt(0,8,'₹'+cv.toFixed(1)+'L',{anchor:'middle',size:54,w:700,fill:tc})}${txt(0,-72,n+' · '+w,{anchor:'middle',size:24,w:700,fill:'#4a463f'})}</g>`});
  return s}
function smallPrint(t){const k=ss(B[8]+.5,B[8]+1,t);if(k<=0)return '';
  return `<g opacity="${.9*k}">${txt(540,1572,'Approx. ₹1 lakh, 1 Jan 2007 → 31 Oct 2026. Nifty = index fund NAV (dividends, after fees).',{anchor:'middle',size:19,w:500,fill:'#6b665e'})}${txt(540,1598,'Gold = 24K price, no making charges/GST. FD = big-bank rate, renewed yearly, before tax.',{anchor:'middle',size:19,w:500,fill:'#6b665e'})}${txt(540,1624,'Past returns, not a promise. Sirf jaankari ke liye.',{anchor:'middle',size:19,w:700,fill:'#6b665e'})}</g>`}
// ---- paper bg ----
const BG=(()=>{let s=`<defs><linearGradient id="fv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".08" stop-color="#fff"/><stop offset=".92" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><mask id="feather" maskUnits="userSpaceOnUse"><rect x="60" y="540" width="960" height="900" fill="url(#fv)"/></mask></defs><rect width="1080" height="1920" fill="${PAPER}"/>`;for(let y=160;y<1900;y+=56)s+=`<line x1="0" y1="${y}" x2="1080" y2="${y}" stroke="#e6dfd2" stroke-width="2"/>`;s+=`<line x1="64" y1="0" x2="64" y2="1920" stroke="#ecc9c2" stroke-width="2"/>`;return s})();
// ---- scene composer ----
function scenes(t){const b=beatAt(t);let s='';
  if(b<=2){ // full illustrations
    const key=b===1?'hook':'picks';const t0=B[b];const z=1.04+.06*ss(t0,B[b+1],t);const pop=ss(t0,t0+.18,t);
    s+=`<g opacity="${pop}">${img(key,60,540,960,900,z,t,{fy:.55,feather:1})}</g>`;
    if(b===1){ // counters
      const k1=ss(B[1]+3.0,B[1]+3.3,t),k2=ss(B[1]+5.1,B[1]+5.4,t);
      const c1=lerp(1,4,ss(B[1]+3.1,B[1]+4.4,t)),c2=lerp(1,15,ss(B[1]+5.2,B[1]+6.6,t));
      if(k1>0)s+=`<g opacity="${k1}" transform="translate(300,1360) rotate(-3)"><rect x="-130" y="-58" width="260" height="96" rx="14" fill="${PAPER}" stroke="${GREY}" stroke-width="5"/>${txt(0,10,'₹'+Math.round(c1)+' lakh',{anchor:'middle',size:50,w:700,fill:'#5f636b'})}</g>`;
      if(k2>0)s+=`<g opacity="${k2}" transform="translate(780,1360) rotate(2) scale(${.8+.2*back((t-B[1]-5.1)/.35)})"><rect x="-150" y="-62" width="300" height="104" rx="14" fill="${ORG}" stroke="${INK}" stroke-width="4"/>${txt(0,14,'₹'+Math.round(c2)+' lakh',{anchor:'middle',size:58,w:700,fill:'#1d140a'})}</g>`;
    }
    if(b===2){ // highlight who picks what: three labels pop in sequence with the voice
      const L=[['FD',GREY,.18,B[2]+.2],['Nifty',BLUE,.5,B[2]+1.3],['Sona',ORG,.82,B[2]+3.0]];
      for(const [w,col,fx,t0] of L){const k=ss(t0,t0+.25,t);if(k<=0)continue;s+=`<g opacity="${k}" transform="translate(${60+fx*960},650) scale(${.6+.4*back((t-t0)/.3)})"><rect x="-90" y="-44" width="180" height="70" rx="35" fill="${col}"/>${txt(0,6,w,{anchor:'middle',size:38,w:700,fill:col===ORG?'#1d140a':'#fff'})}</g>`}
    }
  }else{
    s+=chart(t)+callouts(t);
    // vignette strip under chart
    const vk={3:'sheet',4:'v2008',5:'vflat',6:'vcovid',7:'v2025',8:'v2026'}[b];
    if(b<9){const t0=B[b];const slide=1-ss(t0,t0+.22,t);const z=1.03+.05*ss(t0,B[b+1],t);
      s+=`<g transform="translate(${slide*1080},0)">${img(vk,60,1110,960,330,z,t,{fy:b===3?.45:.5})}<rect x="60" y="1110" width="960" height="330" fill="none" stroke="${INK}" stroke-width="3"/></g>`}
    else{s+=`<g opacity="${ss(B[9],B[9]+.3,t)}">${img('sheet',60,1270,960,200,1.0,t,{fy:.15})}</g>`+finalScore(t)}
  }
  return s}
function renderAt(t){document.getElementById('s').innerHTML=BG+tag(t)+headline(t)+scenes(t)+caption(t)+smallPrint(t)}
window.renderAt=renderAt;renderAt(0);
</script></body></html>
