<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:P;src:url('file:///usr/share/fonts/truetype/google-fonts/Poppins-Bold.ttf');font-weight:700}
html,body{margin:0;background:#000}
#st{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:P,sans-serif;background:#000}
#slides{position:absolute;inset:0;z-index:0}
.sl{position:absolute;inset:0;opacity:0;overflow:hidden}
.sl img{position:absolute;left:50%;top:50%;width:1350px;height:2400px;transform-origin:50% 50%}
#tint{position:absolute;inset:0;pointer-events:none;mix-blend-mode:color;opacity:0;background:#3a4bff}
#flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 52%,#fff 0%,#d8ffe0 30%,rgba(120,255,160,0) 70%);opacity:0;pointer-events:none}
#gold{position:absolute;inset:0;pointer-events:none;opacity:0;mix-blend-mode:screen;background:radial-gradient(circle at 55% 40%,rgba(255,214,110,.55) 0%,rgba(255,170,40,.25) 35%,rgba(0,0,0,0) 70%)}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.45) 100%),linear-gradient(rgba(0,0,0,0) 62%,rgba(0,0,0,.42) 100%)}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.07;mix-blend-mode:overlay}
#sp{position:absolute;inset:0;pointer-events:none}
.s{position:absolute;width:10px;height:10px;border-radius:50%;background:#fff6c8;box-shadow:0 0 14px 6px rgba(255,210,80,.8)}
#cap{position:absolute;left:0;right:0;top:1290px;text-align:center;font-weight:700;font-size:116px;letter-spacing:1px;color:#fff;
 text-shadow:0 6px 0 rgba(0,0,0,.55),0 0 26px rgba(0,0,0,.7),4px 4px 0 #000,-4px -4px 0 #000,4px -4px 0 #000,-4px 4px 0 #000,0 4px 0 #000,4px 0 0 #000,0 -4px 0 #000,-4px 0 0 #000}
#cap.y{color:#FFD43B}
#brand{position:absolute;right:46px;top:70px;font-size:30px;font-weight:700;color:rgba(255,255,255,.8);letter-spacing:2px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
</style></head><body><div id="st">
<div id="slides"></div><div id="tint"></div><div id="gold"></div><div id="sp"></div><div id="flash"></div>
<div id="vig"></div><canvas id="grain" width="540" height="960"></canvas>
<div id="cap"></div><div id="brand">MOMENTIX 💡</div><div id="fade"></div>
</div>
<script>
const TL=__TL__;
const N=9, cuts=TL.cuts, END=TL.end;
// per-scene camera: [zoomFrom, zoomTo, panX0, panX1, panY0, panY1]
const CAM=[[1.04,1.12,0,-20,0,-30],[1.10,1.02,0,0,-40,10],[1.03,1.11,20,-10,0,-20],[1.06,1.14,0,0,30,-30],
 [1.02,1.10,0,0,0,0],[1.10,1.03,-20,10,10,-10],[1.03,1.10,0,30,-20,10],[1.04,1.12,10,-10,0,-20],[1.12,1.02,0,0,-30,20]];
const HI=/^(MITHAI|DOPAMINE|SIP|AUTO-DEBIT|24|GHANTE|JHATKA|PHEEKA|PED|GAYAB|10|HARAO)$/;
document.getElementById('slides').innerHTML=Array.from({length:N},(_,i)=>`<div class="sl" id="s${i}"><img src="s${i+1}.jpg"></div>`).join('');
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),ss=(a,b,x)=>{const k=clamp((x-a)/(b-a));return k*k*(3-2*k)};
const easeIO=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
const back=k=>{k=clamp(k);const c=1.7;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2)};
// sparkles
const SP=[];for(let i=0;i<26;i++){const d=document.createElement('div');d.className='s';$('sp').appendChild(d);SP.push({x:220+Math.random()*640,y:700+Math.random()*700,ph:Math.random()*6.28,sp:.4+Math.random()*.8,sz:.5+Math.random()})}
// grain frames
const g=$('grain').getContext('2d');const GR=[];for(let k=0;k<4;k++){const im=g.createImageData(540,960);for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}GR.push(im)}
const jh=TL.words.find(w=>w.w.startsWith('jhatka')).t;
let lastW=-1;
window.renderAt=function(t){
 let a=0;for(let i=0;i<N;i++)if(t>=cuts[i])a=i;
 const XF=.32;
 for(let i=0;i<N;i++){
  const e=$('s'+i);const t0=cuts[i],t1=(i<N-1?cuts[i+1]:END);
  let op=0,zi=0;
  if(i===a){op=i>0?ss(cuts[a],cuts[a]+XF,t):1;zi=2}
  else if(i===a-1&&t<cuts[a]+XF){op=1;zi=1}
  e.style.opacity=op;e.style.zIndex=zi;
  if(op<=0)continue;
  const c=CAM[i];const u=easeIO(clamp((t-t0)/(t1-t0+XF)));
  let z=c[0]+(c[1]-c[0])*u, px=c[2]+(c[3]-c[2])*u, py=c[4]+(c[5]-c[4])*u;
  // punch-in on entry
  z*=1+0.035*(1-ss(t0,t0+.55,t));
  if(i===4){const k=Math.exp(-Math.pow((t-jh)/.18,2));z*=1+.06*k;px+=Math.sin(t*90)*14*k;py+=Math.cos(t*80)*10*k}
  e.querySelector('img').style.transform=`translate(-50%,-50%) translate(${px}px,${py}px) scale(${z*0.8})`;
 }
 // blue temptation tint for scenes 4-5
 const tb=ss(cuts[3]-.1,cuts[3]+.5,t)*(1-ss(cuts[5]-.1,cuts[5]+.35,t));
 $('tint').style.opacity=(.22+.06*Math.sin(t*5))*tb;
 // dopamine flash
 $('flash').style.opacity=.85*Math.exp(-Math.pow((t-jh-.05)/.16,2));
 // gold glow + sparkles on scene 9
 const gk=ss(cuts[8],cuts[8]+1.2,t);$('gold').style.opacity=gk*(.75+.15*Math.sin(t*2.2));
 SP.forEach((s,k)=>{const d=$('sp').children[k];const tw=.5+.5*Math.sin(t*3*s.sp+s.ph);d.style.opacity=gk*tw;d.style.transform=`translate(${s.x+Math.sin(t*.7+s.ph)*20}px,${s.y-((t*40*s.sp)%300)}px) scale(${s.sz*(.6+.6*tw)})`});
 // captions: one word at a time
 const wi=TL.words.findIndex(w=>t>=w.t&&t<w.e);const cap=$('cap');
 if(wi<0){cap.style.opacity=0}else{const w=TL.words[wi];let txt=w.w.replace(/[….,!]/g,'').toUpperCase();
  if(wi!==lastW){cap.textContent=txt;cap.className=HI.test(txt.replace('?',''))?'y':'';lastW=wi}
  const k=clamp((t-w.t)/.12);cap.style.opacity=1;cap.style.transform=`scale(${.82+.18*back(k)})`;}
 g.putImageData(GR[Math.floor(t*30)%4],0,0);
 $('fade').style.opacity=ss(END-.6,END,t)+ (1-ss(0,.25,t))*0;
 return true};
window.renderAt(0);
</script></body></html>
