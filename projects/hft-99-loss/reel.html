// ---------- helpers
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)), P=(t,a,b)=>cl((t-a)/(b-a));

function cover(I,z=1,ox=0,oy=0,a=1,f='none'){if(a<=0)return;X.save();X.globalAlpha=a;X.filter=f;const s=Math.max(W/I.width,H/I.height)*z,w=I.width*s,h=I.height*s;X.drawImage(I,(W-w)/2+ox,(H-h)/2+oy,w,h);X.restore();}
function T(s,x,y,o={}){const a=o.a??1;if(a<=0)return;X.save();X.globalAlpha=a;X.translate(x,y);const sc=o.sc??1;X.scale(sc,sc);

function speedLines(t,k,c='180,240,255'){X.save();for(let i=0;i<90;i++){const ang=R(i)*Math.PI*2,d0=(R(i+1)*600+t*2400*k)%900+100,len=80+400*k*R(i+2);
