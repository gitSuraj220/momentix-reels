<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:P;font-weight:500;src:url(../engine/fonts/poppins-latin-500-normal.woff2)}
@font-face{font-family:P;font-weight:700;src:url(../engine/fonts/poppins-latin-700-normal.woff2)}
@font-face{font-family:P;font-weight:800;src:url(../engine/fonts/poppins-latin-800-normal.woff2)}
*{margin:0;box-sizing:border-box}
body{width:2560px;height:1440px;overflow:hidden;font-family:P;background:
 radial-gradient(900px 600px at 1780px 720px,rgba(255,190,60,.32),transparent 70%),

 linear-gradient(135deg,#0b1024,#141a3a 55%,#0b1024)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.035) 2px,transparent 2px);background-size:80px 80px}

.brand span{color:#ffc23d}
.by{font-weight:500;font-size:40px;color:#c9d2ff;margin-top:10px;letter-spacing:2px}
.pills{display:flex;gap:22px;margin-top:34px}
.pill{font-weight:700;font-size:42px;color:#0b1024;background:#ffc23d;border-radius:60px;padding:10px 34px}
.pill.b{background:#fff}.pill.c{background:#7fd6ff}
.tag{font-weight:500;font-size:38px;color:#e8ecff;margin-top:30px}
.momo{position:absolute;left:1690px;top:470px;height:480px;filter:drop-shadow(0 20px 40px rgba(0,0,0,.5))}
.sym{position:absolute;font-weight:800;color:rgba(255,194,61,.18)}
</style></head><body><div class="grid"></div>

<div class="sym" style="left:2000px;top:430px;font-size:150px">₹</div>
<div class="sym" style="left:1560px;top:820px;font-size:120px">$</div>
